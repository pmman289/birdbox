log stderr all;
router id 192.0.2.4;
ipv6 table bbtest_ospf6;

protocol device bbtest_device {
  scan time 5;
}

protocol static bbtest_static6 {
  ipv6 { table bbtest_ospf6; };
  route 2001:db8:198:18::4/128 blackhole;
}

protocol ospf v3 bbtest_ospf_v3 {
  ipv6 { table bbtest_ospf6; import all; export all; };
  area 0.0.0.0 {
    interface "bbtest24" { type ptp; cost 10; hello 1; dead count 5; };
    interface "bbtest34" { type ptp; cost 10; hello 1; dead count 5; };
  };
}
